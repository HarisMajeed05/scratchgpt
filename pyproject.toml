[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scratchgpt"
version = "0.2.0"
description = "Modern multimodal decoder with local teacher distillation, SFT/DPO/RL, retrieval, tools and CPU INT8 inference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.5,<2.15",
  "numpy",
  "tokenizers>=0.19",
  "datasets>=2.18",   # 2.18+ can save/restore a streaming dataset's position (instant, crash-safe resume)
  "pillow",
  "huggingface_hub",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]
distill = ["transformers>=4.51,<5", "accelerate>=1.0", "safetensors"]
retrieval = ["faiss-cpu>=1.8"]
semantic = ["faiss-cpu>=1.8", "sentence-transformers>=3"]
tools = ["ddgs>=9"]

[project.scripts]
scratchgpt = "scratchgpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scratchgpt = ["server/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E741", "B905"]   # long lines are fine in this codebase
